# Career-Ops Profile Configuration
# Copy this file to config/profile.yml and fill in your details.
# This is the single source of truth for your personal data across all modes.

candidate:
  full_name: "Jane Smith"
  email: "jane@example.com"
  phone: "+1-555-0123"
  # Optional. Used by `/career-ops email` contact blocks in markets where WeChat
  # is an expected recruiting channel. Omit or leave blank if not applicable.
  wechat: ""
  location: "San Francisco, CA"
  linkedin: "linkedin.com/in/janesmith"
  portfolio_url: "https://janesmith.dev"
  github: "github.com/janesmith"
  twitter: "https://x.com/janesmith"
  # Optional profile photo for the PDF CV (opt-in, #264). Leave empty to omit it
  # entirely: US/UK and many-market ATS penalize photos, so the photoless layout
  # is the default. Set it only for DACH/European markets (Germany, Austria,
  # Switzerland) where a professional photo is expected. Use a local file path or
  # a data: URL — the PDF renderer inlines local images.
  photo: ""

target_roles:
  # Your North Star roles — what you're optimizing for
  primary:
    - "Senior AI Engineer"
    - "Staff ML Engineer"
  # Archetypes help the evaluation system score fit
  archetypes:
    - name: "AI/ML Engineer"
      level: "Senior/Staff"
      fit: "primary"        # primary = dream role, secondary = good fit, adjacent = stretch
    - name: "AI Product Manager"
      level: "Senior"
      fit: "secondary"
    - name: "Solutions Architect"
      level: "Mid-Senior"
      fit: "adjacent"

narrative:
  # Your professional headline (1 line)
  headline: "ML Engineer turned AI product builder"
  # Your exit story — what makes you unique
  exit_story: "Built and sold my SaaS after 5 years. Now focused on applied AI at scale."
  # Your top 3-5 superpowers
  superpowers:
    - "End-to-end ML pipelines"
    - "Fast prototyping (idea to prod in 2 weeks)"
    - "Cross-functional communication"
  # Proof points — projects, articles, case studies with measurable impact
  proof_points:
    - name: "Project Alpha"
      url: "https://janesmith.dev/project-alpha"
      hero_metric: "Reduced inference latency 40%"
    - name: "Open Source Tool"
      url: "https://github.com/janesmith/tool"
      hero_metric: "2K+ GitHub stars"
  # Optional: dashboard/demo URL with credentials
  # dashboard:
  #   url: "https://janesmith.dev/demo"
  #   password: "demo-2026"

compensation:
  target_range: "$150K-200K"     # Your target total comp
  currency: "USD"
  minimum: "$120K"               # Walk-away number
  location_flexibility: "Remote preferred, 1 week/month on-site possible"

location:
  country: "United States"
  city: "San Francisco"
  timezone: "PST"
  visa_status: "No sponsorship needed"
  # For remote roles outside your country:
  # onsite_availability: "1 week/month in any city"
  # Discrete answers for visa-status dropdowns on application forms:
  # visa_form_answer_fulltime: "..."
  # visa_form_answer_parttime: "..."
  sponsorship_answer: "No sponsorship required"

# ── Application form answers (Layer 1 of the live application resolver) ──────
# Static answers the resolver fills deterministically (zero model tokens) via
# field-rules.mjs. The classic fixed fields plus the employer-independent custom
# recurring employer-independent fields. Reviewed by you before submit.
application_answers:
  salary_range: "$150,000 – 200,000"
  notice_period: "2 weeks"
  # Employer-independent custom fields:
  current_residence: "San Francisco, CA, USA"
  open_to_relocation: "Open to relocation for the right role."
  office_days_commitment: "Yes — I can commit to the required days in office."
  work_rights_freetext: "I have full working rights and require no sponsorship."
  work_rights_consent: "Yes, I consent."
  # Sensitive/factual declarations stay blank until the candidate explicitly
  # records them. Blank values fall through to role-local L3 + final review.
  criminal_history: ""
  currently_student: ""
  has_masters: ""
  highest_qualification: ""
  education_status: ""
  # Binary screener radios/selects — emitted verbatim as Yes/No radio answers.
  # FILL IN: review after any visa or employment-status change.
  work_authorized: "Yes"        # legally authorized to work in target country?
  requires_sponsorship: "No"    # requires employer visa sponsorship?
  is_over_18: "Yes"             # are you 18 or older? (also drives "if under 18" inversion)
  has_noncompete: "No"          # non-compete / restraint-of-trade agreement with prior employer?
  has_bachelors: "Yes"          # hold a Bachelor's degree?
  website: "https://your-portfolio.example.com"
  # Part-time guardrail (only used for roles classified part-time):
  # availability_parttime: "..."
  # max_hours_per_week_parttime: 24

# ── Local embedding endpoint (Layer 2 semantic answer cache) ──────────────────
# Optional. Enables zero-token reuse of previously answered form questions via a
# local embedding model. Point `python` at an interpreter that has
# sentence-transformers + torch and can load the model below. Override with
# $CAREER_OPS_EMBED_PYTHON. If unset/unavailable, Layer 2 is skipped gracefully.
# embedding:
#   python: "/abs/path/to/venv/bin/python"
#   model: "google/embeddinggemma-300m"
#   threshold: 0.85   # cosine cutoff for reusing a cached answer

# Optional follow-up cadence preferences for `node followup-cadence.mjs`.
# CLI flags still win for one-off runs (for example `--applied-days 10`).
# followup_cadence:
#   applied_first_days: 7
#   applied_subsequent_days: 7
#   applied_max_followups: 2
#   responded_initial_days: 1
#   responded_subsequent_days: 3
#   interview_thankyou_days: 1

cv:
  output_format: "html" # "html" (default) or "latex"
  # (Optional) Canva resume design ID for visual CV generation via /career-ops pdf.
  # Find it in your Canva design URL: https://www.canva.com/design/DAxxxxxxx/...
  # The ID starts with "D" and is 11 characters long.
  # canva_resume_design_id: "DAxxxxxxxxx"

# ── EEO / Diversity fields ────────────────────────────────────────────────────
# Default is "prefer not to say" for all diversity questions.
# Only used when a field is mandatory AND unskippable. Leave blank to use default.
eeo:
  default: "prefer not to say"
  ethnicity: ""   # e.g. "White", "Asian", "Black or African American"
  gender: ""      # e.g. "Male", "Female", "Non-binary", "Prefer not to say"

# ── Salary (single-number fields) ────────────────────────────────────────────
# Used when a form has a single numeric salary field rather than a free-text range.
salary:
  annual: ""          # e.g. 75000 — annual total compensation
  thousands: ""       # e.g. 75    — for fields labelled in "$K" or "thousands"
  hourly_parttime: "" # e.g. 30    — part-time hourly rate
  hourly_fulltime: "" # e.g. 38    — full-time hourly (annual / 52 / 38)

# ── References ────────────────────────────────────────────────────────────────
references: "Available on request"

# ── Formatting ────────────────────────────────────────────────────────────────
formatting:
  date_format: ""       # e.g. "DD/MM/YYYY" (AU), "MM/DD/YYYY" (US), "YYYY-MM-DD"
  phone_country: ""     # e.g. "+61" (AU), "+1" (US/CA), "+44" (UK)

# ── Automation ────────────────────────────────────────────────────────────────
automation:
  login_timeout_min: 10 # minutes to wait for post-login form signal

# ── Application asset quality and model compatibility ───────────────────────
# New profiles accept any explicitly identified current/future CLI and model.
# This is compatibility, not a claim that every model writes equally well. The
# deterministic evidence, claim, freshness, hash, and human-review gates still
# apply. See docs/MODEL_SELECTION.md for provider-neutral recommendations and an
# optional exact-model allowlist.
application_quality:
  minimum_apply_score: 4.0
  require_explicit_low_score_override: true
  require_fresh_assets: true
  require_quality_manifest: true
  require_evidence_source_match: true
  require_candidate_claim_trace: true
  evidence_min_chars: 12
  require_generation_provenance: true
  allowed_generation_flows: ["interactive-prepare"]
  release_model_policy: "open"  # open | allowlist
  # To enforce a personal model floor, switch to allowlist and add exact IDs.
  # Any CLI/model strings are supported; these are examples, not system limits:
  # allowed_release_models:
  #   codex: ["gpt-5.6-terra", "gpt-5.6-sol"]
  #   claude: ["claude-sonnet-5", "claude-opus-4-8"]
  # Optional provider-neutral effort floor for final assets. If configured, the
  # exact active effort must be stamped; omit for CLIs without effort controls.
  # allowed_release_efforts:
  #   codex: ["high", "xhigh", "max"]
  #   claude: ["high", "xhigh", "max"]
  # Optional exact-model exceptions to that CLI-wide floor. Models not listed
  # here continue to use allowed_release_efforts; arbitrary exact IDs work:
  # allowed_release_model_efforts:
  #   codex:
  #     your-capability-model-id: ["medium", "high", "xhigh", "max"]
  #   claude:
  #     your-capability-model-id: ["medium", "high", "xhigh", "max"]
  # Optional batch-draft restriction. Omit to accept any explicit model ID;
  # batch provenance remains ineligible for release regardless of model.
  # allowed_batch_asset_models: ["your-exact-model-id"]

# ── Queue store backend (optional) ─────────────────────────────────────────────
# Where the apply queue lives. Omit for the sensible default:
#   local    — everything in data/apply-queue.json. Zero accounts, zero cloud.
#              This is the automatic default when Supabase is not configured.
#   supabase — cloud store (your OWN free Supabase project) — needed only for
#              the GitHub discovery crons (scans that run while your laptop is
#              off) and multi-device sync. If you use Supabase, PIN it here so
#              a broken env fails loud instead of silently writing locally.
#
# queue:
#   backend: local

# ── Culture Screen ───────────────────────────────────────────────────────────
#
# Enforces structural capping on the "Cultural signals" dimension during evaluation.
#
# culture_screen:
#   # What you actively look for in a team culture (e.g. org size, meeting frequency, async-first).
#   # If absent/commented, the dimension is scored qualitatively without a hard cap.
#   require:
#     - "Small, flat teams (under 15 engineers)"
#     - "Async-first communication, low meeting overhead"
#   # If true, the dimension is capped at 2/5 if the JD lacks any evidence for the required criteria.
#   # If false (or absent), lack of evidence defaults to a neutral 3/5.
#   deprioritize_if_absent: true

# ── Cover Letter Settings ──────────────────────────────────────────────────
#
# Used by `/career-ops cover` and the cover letter sub-flow in `/career-ops pdf`.
# All fields are optional — omit any you don't need.

cover_letter:
  # Your notice period in calendar days. Surfaced as a prompt default when the
  # JD requests an immediate start. The user confirms the actual value before it
  # appears in the letter.
  notice_period_days: 30

  # Your current professional domain (used to detect domain gaps vs the JD).
  # Plain English, e.g. "digital media", "fintech", "healthcare IT".
  primary_domain: "your current domain"

  # Languages you are actively learning. Each entry MAY produce a closing
  # sentence in that language IF the JD location matches one of the listed
  # countries AND the user confirms inclusion during the cover letter flow.
  # Remove the block entirely if not applicable.
  language_learning:
    - language: Spanish
      current_level: B1
      target_level: B2
      target_date: "end of 2026"
      # The sentence to include, written in that language. Keep it one line.
      sentence: "Estoy aprendiendo español y espero alcanzar el nivel B2 a finales de 2026."
      # Only trigger this entry when the JD location is in one of these countries.
      countries: [Spain, Mexico, Argentina, Colombia, Chile]

  # Which rendered cover-letter format the apply layer auto-attaches per channel.
  # One approved letter renders to several formats (`generate-cover-formats.mjs`):
  # polished PDF (the human format), DOCX (the machine/ATS format), and Markdown
  # (a paste copy). At apply time `chooseCoverFormat()` picks one from the form
  # field's accepted types and the host. Researched defaults (2026): DOCX parses
  # more reliably than PDF on every major ATS (Workday, Greenhouse, Lever, iCIMS,
  # Taleo), so portal uploads default to DOCX; direct email to a human gets the
  # polished PDF. Override here only if you want different behavior. Omit the whole
  # block to use the defaults.
  format_policy:
    # What to upload when a portal field accepts both Word and PDF: docx | pdf.
    portal_default: docx
    # Channel hints that mean a human reads the file directly (no ATS parser),
    # which always get the polished PDF.
    human_channels: [email, direct, human, hiring-manager]

# ── Contact Preferences ──────────────────────────────────────────────────────
#
# Used by `/career-ops contacto` (outreach CTA) and `/career-ops email` (contact
# block) to steer drafted messages toward how you actually want to be reached.
# Optional. Omit the whole block, or set preferred_channel to "either", to keep
# today's behavior unchanged (no channel steering).
#
# contact_preferences:
#   preferred_channel: "email"   # email | phone | either — default "either" if omitted
#   # Optional. Surfaced near the contact block in `/career-ops email` drafts and
#   # can inform the CTA wording in `/career-ops contacto`. Keep it one line.
#   note: "Screens unknown numbers — please email or text first to schedule a call"

# ── Outreach / greeting ─────────────────────────────────────────────────────
#
# Used by the greeting variant of `/career-ops contacto` (the short first-touch
# message for BOSS Zhipin 打招呼, job-board chat, or a cold-email opener).
#
# greeting_max_chars is the hard character budget for that message. Default when
# the key is absent: 150 (BOSS Zhipin's greeting limit). Raise or lower it to
# match the platform you're messaging on.
# outreach:
#   greeting_max_chars: 150

# ── Application Email Drafts ────────────────────────────────────────────────
#
# Used by `/career-ops email` when drafting formal application emails. This is
# separate from `contacto` short outreach and `cover` full cover letters.
# All fields are optional.
#
# application_email:
#   include_contact_block: true
#   include_attachment_checklist: true
#   # Use this when you want the email body to say "the email used to send this
#   # message" instead of printing a concrete email address from candidate.email.
#   # default_sender_note: "the email used to send this message"
#   # signature_name: "Jane Smith"

# ── Scan / JD extractor ─────────────────────────────────────────────────────
#
# How the scan and JD-extraction steps read SPA job pages.
#   mcp (default) — the browser MCP (browser_navigate + browser_snapshot). Works
#                   out of the box; the snapshot is token-heavy.
#   cli           — the headless `browser-extract.mjs` helper: renders the page
#                   and returns compact JSON, cutting per-page tokens ~2–5×. Opt-in.
#                   If the helper isn't available, the modes fall back to mcp
#                   silently, so nothing breaks. `doctor` reports the active mode.
# scan:
#   extractor: mcp   # mcp (default) | cli

# ── Explicit draft-PDF score filter ─────────────────────────────────────────
#
# `/career-ops pipeline` and `batch/batch-runner.sh` are evaluation-only unless
# the candidate explicitly enables non-release draft PDFs for that run (for
# example `batch/batch-runner.sh --draft-pdf`).
#
# `auto_pdf_score_threshold` is only the second-stage score filter after that
# explicit draft-PDF activation. It never enables PDF generation, selects a
# role, starts PREPARE, or creates release-ready application assets by itself.
#
# Default when draft PDFs were explicitly enabled and this key is absent: 3.0.
# Raise it (for example 4.0) to draft only stronger matches. Fractional values
# work. Set it to 0 to draft every evaluated offer in an explicitly activated
# draft-PDF run. Without explicit activation, every value remains report-only.
# auto_pdf_score_threshold: 4.0

# ── Re-apply Cooldown Windows ──────────────────────────────────────────────
#
# Define cooldown windows for companies where you've recently applied.
# The scanner will skip new postings at these companies during the window.
#
# re_apply_windows:
#   CompanyA:
#     same_role_days: 180
#     cross_role_bucket: "all_EM_roles"
#     applied_to: ["Senior Software Engineer"]
#     last_apply_date: "2026-01-01"
