name: Tests

on:
  pull_request:
    branches: [main]

# A force-push supersedes the running matrix; cancel it instead of letting
# stale legs occupy runners (3 jobs per push at this repo's PR volume).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One OS failing must not cancel the evidence from the others —
      # a platform-specific failure is exactly what this matrix exists to isolate.
      fail-fast: false
      matrix:
        # windows-latest is deliberately NOT in this matrix on the fork.
        # Upstream ships to Windows users and carries the leg for them; this fork
        # is a personal macOS tool whose engine only ever runs on macOS, with
        # ubuntu covering container/Actions parity. Keeping the leg meant every
        # upstream pull could surface an unbounded tail of Windows-only test
        # failures — five in the 2026-07-28 catch-up alone — on a platform no
        # user of this repo runs. The genuine defects that leg exposed (the
        # cross-drive containment holes) were fixed and are guarded by a
        # platform-independent test, so dropping the leg loses no real coverage.
        # Re-add it here if this fork ever needs to support Windows.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # Skip the postinstall (npx playwright install chromium); the tests
      # never launch a browser, so the ~170 MB download is pure CI overhead.
      - run: npm install --ignore-scripts
      - run: node test-all.mjs --quick
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard

  node18-smoke:
    name: Node 18 minimum-version smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
      # Keep the minimum-version leg small and browser-free. It exercises the
      # actual no-node:sqlite tracker fallback plus doctor/package contracts.
      - run: npm install --ignore-scripts
      - name: Run packaging and runtime smoke
        run: |
          node --check doctor.mjs
          node --check tracker.mjs
          node tests/packaging-parity.test.mjs
          node doctor.mjs --setup
