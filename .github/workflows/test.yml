name: Tests

on:
  pull_request:
    branches: [main]

# A force-push supersedes the running matrix; cancel it instead of letting
# stale legs occupy runners (3 jobs per push at this repo's PR volume).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One OS failing must not cancel the evidence from the others —
      # a platform-specific failure is exactly what this matrix exists to isolate.
      fail-fast: false
      matrix:
        # This fork is developed on macOS but DISTRIBUTED: the release publishes
        # @neilshekhar/career-ops to npm and the README quick start clones this
        # repo, so Windows users run this code. The leg stays for them. It earns
        # its keep — the 2026-07-28 catch-up alone surfaced five Windows-only
        # defects here, including a cross-drive path-containment hole that let a
        # caller-authored artifact pass as being inside reports/ (see Recurring
        # Conflict Resolution #10 in UPSTREAM_MERGE_CHECKLIST.md).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout and make regexes that
      # rely on `.` (no \r) fail in ways the other platforms never see.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # Skip the postinstall (npx playwright install chromium); the tests
      # never launch a browser, so the ~170 MB download is pure CI overhead.
      - run: npm install --ignore-scripts
      - run: node test-all.mjs --quick
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard

  node18-smoke:
    name: Node 18 minimum-version smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
      # Keep the minimum-version leg small and browser-free. It exercises the
      # actual no-node:sqlite tracker fallback plus doctor/package contracts.
      - run: npm install --ignore-scripts
      - name: Run packaging and runtime smoke
        run: |
          node --check doctor.mjs
          node --check tracker.mjs
          node tests/packaging-parity.test.mjs
          node doctor.mjs --setup
