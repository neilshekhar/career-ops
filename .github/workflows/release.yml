name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_scaffolder:
        description: Publish the current scaffolder package to npm
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Publish the npm scaffolder with npm Trusted Publishing/OIDC when a
      # release was just created, or when manually dispatched.
      # Runs in the same job because a release created via GITHUB_TOKEN does
      # not trigger separate `on: release` workflows.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_scaffolder) }}
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_scaffolder) }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_scaffolder) }}
        # Pin to the stable 11.x line (trusted publishing since 11.5.1). Do NOT
        # float on npm@latest: it now resolves to the 12.x line, whose
        # provenance path fails with "Cannot find module 'sigstore'" during
        # trusted-publishing provenance generation (npm/cli#9722). Revisit once
        # that regression is fixed on 12.x.
        run: npm install -g npm@11.18.0
      - name: Read scaffolder package metadata
        id: scaffolder
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_scaffolder) }}
        run: |
          echo "name=$(node -p "require('./scaffolder/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./scaffolder/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check npm package version
        id: npm_package
        if: ${{ steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_scaffolder) }}
        run: |
          if npm view "${{ steps.scaffolder.outputs.name }}@${{ steps.scaffolder.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.scaffolder.outputs.name }}@${{ steps.scaffolder.outputs.version }} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish scaffolder to npm
        if: ${{ (steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_scaffolder)) && steps.npm_package.outputs.exists != 'true' }}
        run: npm publish --access public
        working-directory: scaffolder
