name: Apify Job Discovery Cron

# Seek + Indeed + Fantastic.jobs Workday job discovery via Apify actors.
# Discovers new roles and inserts status='new' stubs into Supabase via the
# RLS-bounded career_ops_cron credential. Zero LLM tokens — pure HTTP + JSON.
#
# Schedule: Mon / Wed / Fri, 19:30 UTC (= 05:30 AEST next day).
#   Monday      = Seek + Indeed + Fantastic (Workday)   $0.54
#   Wed and Fri = Seek + Fantastic                      $0.25
#   Indeed rides weekly because it is the only actor with no incremental mode;
#   see 'Why Indeed is weekly' below.
#
#   Cost calibration — MEASURED from live Apify invoices on 2026-08-20 at the
#   current 10-title portals.yml seed list, not estimated:
#     • Seek      $0.01/run + $0.002/result, ONE run per title, and it TRUNCATES
#                 at maxResults (9 of 10 titles returned exactly the old cap of
#                 20). So Seek = titles x ($0.01 + cap x $0.002), fully
#                 deterministic. At 10 titles / cap 6 → $0.22 per pass.
#                 Incremental mode verified working: a second run 10 minutes
#                 later returned 0 results and billed run-charges only.
#     • Indeed    $0.005/run + $0.003/result, one run per title, NO incremental
#                 mode — a repeat run 10 minutes later re-billed the full $0.33
#                 for the identical 92 records and inserted nothing. At the 7-day
#                 window it is demand-saturated, so its cap binds too:
#                 titles x ($0.005 + cap x $0.003) = $0.29/pass at cap 8.
#     • Fantastic single run for ALL titles (titleSearch takes the array), so its
#                 cost does NOT scale with the seed count: 13 results → $0.03.
#
#   Cost-per-inserted-role on the 2026-08-20 measurement pass:
#     Fantastic $0.015  ·  Seek $0.052  ·  Indeed $0.083
#
#   Monthly total at Seek cap 6 / Indeed cap 8, over every month of 2026-2027:
#     • average month → $4.52
#     • worst-case month (2027-03: 5 Mon + 9 Wed/Fri) → $4.95
#   Both inside the $5/mo budget, and the caps are sized against the WORST month
#   rather than the average so a 5-Monday month cannot breach it.
#   The previous Mon/Tue/Thu all-source cadence measured ~$11.35/month at the
#   same seed list — over budget by 2.3x.
#
#   HEADROOM WARNING: Fantastic's $0.03 is the one term that is NOT fixed — it
#   bills per result and currently returns 13. Worst case leaves only ~$0.05 of
#   slack, so if the Workday pool grows past ~30 results the month can tip over.
#   First dial to turn if that happens: Seek maxResults 6 -> 5 (saves ~$0.28/mo).
#
# Why Mon/Wed/Fri and not weekly: fresher postings mean a better chance of being
#   an early applicant, so the budget is spent on FREQUENCY rather than depth.
#   Seek's incremental mode makes frequency cheap (only genuinely-new postings
#   are billed); its per-title run charge is the only fixed cost.
#
# Why the lookbacks differ (apify-discover.mjs): each actor's window must span
#   its own longest gap, or the intervening days are never scanned. The old
#   24-hour lookback on a Mon/Tue/Thu schedule left Friday, Saturday and most of
#   Wednesday permanently invisible — roughly 3 of every 7 days. Now:
#     Seek   runs Mon/Wed/Fri → 3-day window (widest gap is Fri→Mon)
#     Indeed runs Mondays     → 7-day window (gap is a full week)
#   A wider window does not re-bill Seek, because incremental mode suppresses
#   already-seen postings. It DOES cost Indeed, which is why Indeed's cap is low.
#
# Why Indeed is weekly rather than every run: it has the worst cost-per-insert of
#   the three AND no incremental mode, so each run pays full price for a heavily
#   overlapping window. Putting it on all three days would force Seek's cap down
#   to ~2 to stay in budget, losing far more than Indeed adds. Weekly keeps the
#   source without letting it crowd out the frequency on Seek.
#
#   api-cron.yml runs at 19:00 UTC; this workflow is offset +30 min to prevent
#   concurrent Supabase writes.
#
# ── First-run validation ────────────────────────────────────────────────────────
# DO NOT rely on the scheduled triggers for first validation.
# Trigger workflow_dispatch manually (default: seek,indeed) and confirm:
#   (a) stubs appear in Supabase active_roles with status='new'
#   (b) the JWT mint step shows the token as *** in logs — nothing leaks
#   (c) the run stays in budget (no 200-job Fantastic call on the default choice)
# Only after a green watched smoke run should the scheduled triggers run unattended.
# ───────────────────────────────────────────────────────────────────────────────
#
# Security notes:
# - SUPABASE_CRON_SIGNING_KEY lives in the 'cron' GitHub Environment, which is
#   restricted to the default branch (main). Non-main branches cannot read it.
# - The signing key is never written to disk; mint-cron-jwt.mjs reads it from
#   the CAREER_OPS_SIGNING_KEY env var and prints only the JWT to stdout.
# - The minted JWT exists for 10 minutes and is masked with ::add-mask:: so it
#   never appears in logs. GitHub auto-masks the registered secrets.
# - portals.yml is reconstructed from a secret via printf (never echoed).
# - Nothing is committed or pushed; the runner is ephemeral.
# - actions/* are SHA-pinned (see steps below) to prevent supply-chain attacks
#   on this signing-key-bearing workflow. npm install uses --ignore-scripts.
# - Note: committing package-lock.json + npm ci would add dep-version pinning;
#   deferred as a repo-wide convention change.
#
# Secrets required in the 'cron' GitHub Environment:
#   Reused from api-cron: SUPABASE_URL, SUPABASE_CRON_PUBLISHABLE_KEY,
#                          SUPABASE_CRON_SIGNING_KEY, PORTALS_YML
#   New (add before first run): APIFY_TOKEN — personal Apify API token.
#   Without APIFY_TOKEN, the run step fails immediately at apifyToken() with a
#   clear error; no Apify actor cost is incurred.
#
on:
  schedule:
    # Monday 19:30 UTC = 05:30 AEST Tue — all three actors, Indeed's weekly slot.
    - cron: '30 19 * * 1'
    # Wed + Fri 19:30 UTC — Seek + Fantastic only (Indeed would re-bill its whole
    # window for nothing). Day-of-week (not day-of-month stepping) so there is NO
    # month-boundary drift. 12-14 runs/month total, $4.52 avg (see header).
    - cron: '30 19 * * 3,5'
  workflow_dispatch:
    # Manual trigger for smoke testing and on-demand runs.
    # Default matches the schedule so a manual run costs what a scheduled one
    # costs; pick 'indeed' or 'all' only when you deliberately want to spend the
    # extra ~$0.33 on the non-incremental Indeed actor.
    # Note: workflow_dispatch from a feature branch will fail on the mint step
    # if the 'cron' environment restricts secrets to main only. Run from main,
    # or temporarily add the branch to the environment's branch policy during dev.
    inputs:
      source:
        description: 'Actors to run'
        type: choice
        default: 'seek,fantastic-ats'
        options:
          - 'seek,fantastic-ats'  # Wed/Fri schedule — ~$0.25/run at 10 titles
          - 'all'                 # Monday schedule, all three — ~$0.54/run
          - 'indeed'              # Indeed alone, on demand — ~$0.29/run

permissions:
  contents: read  # checkout only; nothing is committed or pushed

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: cron
    steps:
      - name: Decide run plan
        # Single source of truth for "should this invocation spend Apify credit,
        # and with which actors?". Emits two outputs:
        #   should_run: 'true'/'false' — gates EVERY step below (checkout, Node,
        #               install, PORTALS_YML reconstruction, validate, JWT mint,
        #               Apify run) so a no-op invocation is a true no-op: no
        #               secret reconstruction, no JWT mint, no Apify call ($0).
        #   mode:       which actors to run. Monday runs 'all' (Indeed's weekly
        #               slot); Wed/Fri run 'seek,fantastic-ats'; a dispatch may
        #               override with any documented choice.
        # No date-gated branches remain — the cadence is sized to fit the $5/mo
        # budget outright (see the header calibration). No ${{ }} interpolation
        # here (github.event values are read via env, not spliced into bash).
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source }}
        run: |
          SHOULD_RUN=false
          MODE="seek,fantastic-ats"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_RUN=true
            # Only accept the documented choices; anything else keeps the default.
            case "$DISPATCH_SOURCE" in
              all|indeed|seek,fantastic-ats) MODE="$DISPATCH_SOURCE" ;;
            esac
          elif [ "$SCHEDULE" = "30 19 * * 1" ]; then
            # Monday: all three actors — this is Indeed's weekly slot.
            SHOULD_RUN=true
            MODE="all"
          elif [ "$SCHEDULE" = "30 19 * * 3,5" ]; then
            # Wed + Fri: Seek + Fantastic only.
            SHOULD_RUN=true
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Decision: should_run=$SHOULD_RUN mode=$MODE (event=$EVENT_NAME schedule='$SCHEDULE')"

      # ── Every step below is gated on the decision ────────────────────────────
      # A no-op invocation (e.g. a pre-2026-07-23 Tuesday) does NOTHING but the
      # decision step above: no checkout, no Node, no npm install, and crucially
      # no PORTALS_YML secret reconstruction or JWT mint. True no-op — zero Apify
      # spend, zero secret exposure, negligible Actions minutes.
      - name: Checkout
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false  # workflow never pushes

      - name: Set up Node.js
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.decide.outputs.should_run == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund
        # Playwright browsers are NOT installed — apify-discover.mjs is pure
        # HTTP + JSON (no Playwright, no Chromium). No --production flag so
        # jose, js-yaml, and dotenv are available.

      - name: Reconstruct portals.yml
        # portals.yml is gitignored; reconstruct from the secret.
        # printf prevents a trailing newline that some editors add; never
        # use echo here (would reveal contents on --xtrace).
        if: steps.decide.outputs.should_run == 'true'
        env:
          PORTALS_YML: ${{ secrets.PORTALS_YML }}
        run: printf '%s' "$PORTALS_YML" > portals.yml

      - name: Validate reconstructed portals.yml has a non-empty title filter
        if: steps.decide.outputs.should_run == 'true'
        # Fail closed on a blank/degenerate PORTALS_YML secret. An empty OR
        # blank-keyword title_filter.positive makes buildTitleFilter() pass ALL
        # titles (String.includes("") is always true), which would spend Apify
        # credit and insert off-target stubs under --apply. apify-discover.mjs
        # only fails closed when the file is missing/unreadable, not when it
        # parses to {} or carries blank keywords — so guard here, before mint + Apify.
        # No ${{ }} interpolation in this step (no injection surface).
        run: |
          node -e '
            const yaml = require("js-yaml");
            const fs = require("fs");
            const cfg = yaml.load(fs.readFileSync("portals.yml", "utf8")) || {};
            const pos = (cfg.title_filter && cfg.title_filter.positive) || [];
            const ok = Array.isArray(pos) && pos.length > 0 &&
                       pos.every(k => typeof k === "string" && k.trim() !== "");
            if (!ok) {
              console.error("FATAL: portals.yml title_filter.positive must be a non-empty list of non-blank keywords — refusing to run (a blank keyword makes buildTitleFilter pass all titles).");
              process.exit(1);
            }
            console.log("title_filter.positive OK (" + pos.length + " keyword(s))");
          '

      - name: Mint short-lived cron JWT
        # The signing key stays in memory (env var) — never written to disk.
        # The minted JWT is masked so it never appears in logs.
        # Gated on the decision: a no-op invocation (e.g. a pre-2026-07-23
        # Tuesday) mints nothing.
        if: steps.decide.outputs.should_run == 'true'
        env:
          CAREER_OPS_SIGNING_KEY: ${{ secrets.SUPABASE_CRON_SIGNING_KEY }}
        run: |
          JWT="$(node mint-cron-jwt.mjs --exp-seconds 600)"
          echo "::add-mask::$JWT"
          echo "SUPABASE_CRON_JWT=$JWT" >> "$GITHUB_ENV"

      - name: Run Apify discovery
        # apify-discover.mjs selects actors via --source (or runs all three if
        # omitted). Current script caps:
        #   Seek:      maxResults 6/title, 3-day dateRange, incremental mode
        #   Indeed:    maxItems 8/title, 7-day datePosted, NO incremental mode
        #   Fantastic: maxJobs 200, single run for all titles
        # --apply is always passed so inserts actually happen; fail-closed guards
        # inside the script reject --apply when cron creds or portals.yml are absent.
        # SUPABASE_CRON_JWT is already in GITHUB_ENV from the mint step above.
        # RUN_MODE comes from the 'Decide run plan' step, which already resolved
        # event/schedule and validated the value against the allowed set. It is
        # forwarded verbatim to --source, EXCEPT 'all', which means "omit --source
        # so every registered actor runs" ('all' is not an actor name, so passing
        # it through would match no sources and exit 1).
        if: steps.decide.outputs.should_run == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CRON_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_CRON_PUBLISHABLE_KEY }}
          RUN_MODE: ${{ steps.decide.outputs.mode }}
        run: |
          if [ "$RUN_MODE" = "all" ]; then
            # Every registered actor, Indeed included (~$0.70/run at 10 titles).
            node apify-discover.mjs --apply
          else
            # Scheduled default 'seek,fantastic-ats', or an on-demand 'indeed'.
            node apify-discover.mjs --source "$RUN_MODE" --apply
          fi
