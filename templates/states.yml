# Career-Ops — Canonical States
# Source of truth for career-ops (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in applications.md must contain EXACTLY one entry with
# scope: tracker (case-insensitive). Queue-only states never belong in the
# tracker. No markdown bold (**), dates, or extra text; dates use their column.

states:
  # Pre-application queue states (managed via data/apply-queue.json)
  # These map to tracker states when a decision is made.
  - id: saved
    scope: queue
    label: Saved
    aliases: [new, queued]
    description: Role saved to queue, pending scoring (maps to Evaluated on decide)
    dashboard_group: evaluated

  - id: scored
    scope: queue
    label: Scored
    aliases: []
    description: Role scored, awaiting selection in the dashboard (maps to Evaluated on decide)
    dashboard_group: evaluated

  - id: prepared
    scope: queue
    label: Prepared
    aliases: [prepare-queued, ready]
    description: CV + documents generated, form fields resolved (maps to Evaluated on decide)
    dashboard_group: evaluated

  - id: prefilled
    scope: queue
    label: Prefilled
    aliases: [headless-filled, pre-filled]
    description: Lean-llm-v1 review-ready fill (default live path) — compact Application Answers written; candidate reviews in browser and Mark Submitted via manual confirmation. Also covers legacy incomplete checkpoints that never finished receipt-v3.
    dashboard_group: evaluated

  - id: filled
    scope: queue
    label: Filled
    aliases: [form-filled, auto-filled]
    description: Receipt-v3 only — durable per-page receipt verified and final application boundary reached; awaiting candidate's combined review and receipt-gated Mark Submitted
    dashboard_group: evaluated

  # Post-application tracker states
  - id: evaluated
    scope: tracker
    label: Evaluated
    aliases: [evaluada, condicional, hold, evaluar, verificar, değerlendirildi, degerlendirildi]
    description: Offer evaluated with report, pending decision
    dashboard_group: evaluated

  - id: applied
    scope: tracker
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent]
    description: Candidate submitted the application after review; receipt Mark Submitted requires receipt-verified Filled, while lean Prefilled (and other active statuses) use candidate manual Mark Submitted
    dashboard_group: applied

  - id: responded
    scope: tracker
    label: Responded
    aliases: [respondido, "yanıt verildi", yanıt_verildi, "yanit verildi", yanit_verildi]
    description: Company has responded (not yet interview)
    dashboard_group: responded

  - id: interview
    scope: tracker
    label: Interview
    aliases: [entrevista, mülakat, mulakat]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    scope: tracker
    label: Offer
    aliases: [oferta, teklif]
    description: Offer received
    dashboard_group: offer
    terminal: true

  - id: rejected
    scope: tracker
    label: Rejected
    aliases: [rechazado, rechazada, reddedildi]
    description: Rejected by company
    dashboard_group: rejected
    terminal: true

  - id: discarded
    scope: tracker
    label: Discarded
    aliases: [descartado, descartada, cerrada, cancelada, "iptal edildi", iptal_edildi, "ıptal edildi", ıptal_edildi]
    description: Discarded by candidate or offer closed
    dashboard_group: discarded
    terminal: true

  - id: skip
    scope: tracker
    label: SKIP
    aliases: [no_aplicar, no aplicar, skip, monitor, geo blocker, geo_blocker, "uygun değil", uygun_değil, "uygun degil", uygun_degil]
    description: Doesn't fit, don't apply
    dashboard_group: skip
    terminal: true

  - id: hired
    scope: tracker
    label: Hired
    aliases: [contratado, contratada, hired, accepted, accept, "kabul edildi", kabul_edildi, "işe alındı", "ise alindi", "işe alindi"]
    description: Offer accepted, job landed!
    dashboard_group: hired
    terminal: true
